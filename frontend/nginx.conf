# nginx внутри контейнера фронта: отдаёт статику сборки Vite.
# Внешний nginx (infrastructure/nginx) проксирует / на этот контейнер, а /api — на backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любые пути отдаём index.html (маршрутизация на клиенте).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш для собранных ассетов с хэшом в имени.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PDF.js запускает worker как ES module; браузер блокирует octet-stream.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
