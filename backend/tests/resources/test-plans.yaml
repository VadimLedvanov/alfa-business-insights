# Company context: service unit tests
"alpha.business.insight.core.qa.company.CompanyContextServiceTest#TestUnitCalculatesCounterpartyShares": "Доли контрагентов рассчитываются от полного оборота||Подготовить три контрагента и ограничить выдачу двумя записями|Получить контекст компании и проверить доли, концентрацию и вызов репозитория с лимитом|Ожидается две записи, доли 0.6 и 0.3 от общего оборота, top1 0.6 и top3 1.0."
"alpha.business.insight.core.qa.company.CompanyContextServiceTest#TestUnitReportsMissingPayments": "Пустая группа и отсутствие платежей отражаются в контексте||Создать компанию без профиля группы и платежных связей|Получить контекст и проверить группы, контрагентов, концентрацию и признаки отсутствующих данных|Ожидаются пустые списки, нулевой оборот, неизвестные доли и маркеры profile.missing, payments и paymentShares."
"alpha.business.insight.core.qa.company.CompanyContextServiceTest#TestUnitReturnsNotFound": "Неизвестная компания возвращает 404||Настроить отсутствие компании в репозитории|Запросить контекст по неизвестному идентификатору|Ожидается ResponseStatusException со статусом NOT_FOUND."
"alpha.business.insight.core.qa.company.CompanyContextServiceTest#TestUnitRejectsInvalidLimit": "Неположительный лимит отклоняется||Создать сервис с лимитом контрагентов равным нулю|Проверить тип исключения|Ожидается IllegalArgumentException."

# Company context: PostgreSQL and HTTP integration
"alpha.business.insight.core.company.CompanyContextIntegrationTest#givenGroupAndBidirectionalPayments_whenGetContext_thenReturnProfileRankingsAndMissingData": "Профиль компании, группа и двунаправленные платежи возвращаются единым контекстом||Подготовить компанию, участника группы и платежи обеих сторон|Запросить API с ролями SYSTEM_ADMIN и COMPANY_DIRECTOR|Ожидаются профиль, две компании в группе, пять контрагентов в порядке оборота, правильные входящие и исходящие суммы, доли и missingData."
"alpha.business.insight.core.company.CompanyContextIntegrationTest#givenNoGroupOrPayments_whenGetContext_thenReturnEmptyListsAndUnknownShares": "Контекст без группы и платежей отмечает пробелы данных||Подготовить компанию без группы и платежей|Запросить контекст директором|Ожидаются пустые группы и контрагенты, нулевой оборот, неизвестные доли и перечень отсутствующих признаков."
"alpha.business.insight.core.company.CompanyContextIntegrationTest#givenSmallConfiguredLimit_whenGetContext_thenCalculateConcentrationAcrossThreeCounterparties": "Концентрация считается по полному обороту при лимите выдачи||Получить контекст сервиса с лимитом выдачи два|Проверить число контрагентов и показатели оборота|Ожидаются две записи, полный оборот 1000, top3Share 0.85; лимит ноль отклоняется."
"alpha.business.insight.core.company.CompanyContextIntegrationTest#givenZeroAmountsAndTies_whenGetContext_thenReturnStableOrderWithoutDividingByZero": "Нулевые обороты и равные суммы обрабатываются устойчиво||Обнулить платежи компании|Получить контекст и проверить порядок и доли|Ожидается стабильная сортировка, null для долей и признак paymentShares без деления на ноль."
"alpha.business.insight.core.company.CompanyContextIntegrationTest#givenConflictingProfileAndPartialGroup_whenGetContext_thenReportMissingFeatures": "Конфликтный профиль и неполная группа отмечаются как недостающие||Обновить профиль компании и участника группы на конфликтные и неполные данные|Получить оба контекста и проверить missingData|Ожидаются маркеры конфликтного профиля, отрасли и пустого списка стран ВЭД."
"alpha.business.insight.core.company.CompanyContextIntegrationTest#givenOneCounterparty_whenGetContext_thenConcentrationIsOneAndIncomingDirectionIsPreserved": "Один контрагент даёт концентрацию 100 процентов||Использовать компанию с одной входящей связью|Получить контекст и проверить направление и концентрацию|Ожидаются одна запись, входящая сумма 300, исходящая 0 и top1/top3 равные 1."
"alpha.business.insight.core.company.CompanyContextIntegrationTest#givenUnknownCompany_whenGetContext_thenNotFound": "Запрос неизвестной компании возвращает 404||Запросить отсутствующий идентификатор с системной ролью|Проверить HTTP статус|Ожидается NOT_FOUND."
"alpha.business.insight.core.company.CompanyContextIntegrationTest#givenPublicSpecification_whenGetOpenApi_thenDescribeCompanyContextUnderCommonPrefix": "OpenAPI описывает API контекста компании||Получить публичную OpenAPI спецификацию|Проверить общий префикс, маршрут, ответ 404 и схему полей|Ожидается описание /companies/{id} под /api и документированные profile и missingData."
"alpha.business.insight.core.company.CompanyContextIntegrationTest#givenMissingOrInsufficientRole_whenGetContext_thenRejectRequest": "Для контекста компании требуется разрешённая роль||Выполнить запрос без JWT и с ролью OTHER|Проверить ответы фильтра безопасности|Ожидаются 401 без токена и 403 для неподдерживаемой роли."
"alpha.business.insight.core.qa.company.CompanyContextSmokeTest#TestSmokeCompanyContextCalculations": "HTTP контекст отражает профиль, группу и платежи PostgreSQL||Создать изолированные записи компании, участника группы и встречных платежей|Получить настоящий токен Keycloak и запросить API|Ожидаются профиль, две компании в группе, оборот и доля контрагента равные 500 и 1."
"alpha.business.insight.core.qa.company.CompanyContextHttpE2eTest#TestE2ECompanyAccessRequiresGrant": "Чтение компании требует связи пользователя с компанией||Создать компанию без строки user_company_access и получить токен директора|Запросить контекст и сравнить статус с требованием видения, раздел 2.4|Ожидается 403; текущий код возвращает 200 и тест отмечен known-defect до исправления."
"alpha.business.insight.core.qa.insights.InsightConcurrencyHttpE2eTest#TestE2EConcurrentInsightPostsShareCachedResult": "Параллельные POST одной компании возвращают общий кэшированный результат||Одновременно отправить два POST для одинаковых компании и события|Сравнить ответы обоих запросов и сохранённый инсайт|Ожидаются одинаковые ответы и одна сохранённая запись инсайта."
"alpha.business.insight.core.qa.insights.InsightConcurrencyHttpE2eTest#TestE2EConcurrentCompanyInsightsKeepSeparateCacheEntries": "Параллельные инсайты сохраняют отдельные результаты для каждой компании||Одновременно отправить POST для трёх компаний с одинаковым событием|Сверить разные id и trace_id, сохранённые записи и GET каждой компании|Для каждой компании сохраняются отдельные id и trace_id, а GET возвращает результат её POST."

# CSV import: parser and service unit tests
"alpha.business.insight.core.qa.dataimport.CsvImportServiceTest#TestUnitReportsRejectedPaymentRows": "Импорт отчётливо разделяет принятые и ошибочные платежи||Передать строку с неверной суммой и корректную строку с пробелами|Проверить отчёт и фактически скопированные поля|Ожидаются одна принятая и одна отклонённая строка, понятная причина ошибки и нормализованные значения."
"alpha.business.insight.core.qa.dataimport.CsvImportServiceTest#TestUnitRejectsInvalidPaymentFields": "Некорректные платежные поля отклоняются с указанием причины||Для каждого варианта передать отсутствующего получателя, отрицательную сумму, дробный или переполненный счётчик|Проверить результат импорта и сообщение ошибки|Все варианты отклоняются, принятых строк нет, причина указывает соответствующее обязательное поле или тип значения."
"alpha.business.insight.core.qa.dataimport.CsvImportServiceTest#TestUnitReadsBomQuotedFields": "BOM и разделитель внутри кавычек сохраняют значение CSV||Передать UTF-8 BOM и значение ORG_TYPE с точкой с запятой в кавычках|Проверить принятый профиль и сериализованную строку|Ожидается одна принятая строка с исходным текстом value;part."

# CSV import: PostgreSQL and startup migration
"alpha.business.insight.core.dataimport.CsvImportIntegrationTest$InitialImport#givenProfilesLinksAndPayments_whenImportFiles_thenSaveDataAndReportQuality": "Первичный импорт сохраняет профили, связи и агрегаты||Импортировать три подготовленных CSV-файла|Загрузить записи и отчёт из PostgreSQL и проверить качество строк|Ожидаются согласованные количества принятия и ошибок, конфликтный профиль, компании, платежи и связь с обновлёнными данными."
"alpha.business.insight.core.dataimport.CsvImportIntegrationTest$RepeatedImport#givenExistingData_whenImportFilesAgain_thenPreserveIdsAndRefreshAmounts": "Повторный импорт сохраняет ключи и обновляет суммы||Импортировать данные дважды и сравнить UUID агрегатов и связей|Изменить сумму платежа и импортировать снова|Ожидаются прежние идентификаторы и новая сумма 22.30 без дублирования строк."
"alpha.business.insight.core.dataimport.CsvImportIntegrationTest$RepeatedImport#givenCompanyWithoutProfile_whenImportProfile_thenEnrichCompanyAndPreserveLinks": "Импорт дополняет отсутствующий профиль||Импортировать набор данных, затем направить профиль имеющейся компании на другую запись|Повторно импортировать и сверить связанные сущности|Ожидается доступный профиль компании, связи и платежи остаются целыми."
"alpha.business.insight.core.dataimport.CsvImportIntegrationTest$ImportFailures#givenMalformedCsv_whenImportFiles_thenThrowUncheckedIOExceptionAndAllowRetry": "Ошибка разбора CSV сохраняет прежние данные и допускает повтор||Импортировать базовые данные и сохранить состояние таблиц|Передать незакрытую кавычку, проверить сохранность данных до записи, восстановить файл и повторить импорт|Ожидается UncheckedIOException без частичных изменений; исправленный повтор завершается с исходным количеством платежей."
"alpha.business.insight.core.dataimport.CsvImportIntegrationTest$ImportFailures#givenWrongHeaders_whenImportFiles_thenThrowIOExceptionAndPreserveDatabase": "Неверные заголовки CSV отклоняются до сохранения строк||Передать файл платежей с неправильными колонками|Проверить исключение и состояние таблиц|Ожидается IOException с пояснением expected headers и пустая таблица компаний."
"alpha.business.insight.core.dataimport.CsvImportIntegrationTest$ImportFailures#givenPaymentCountOverflow_whenImportFiles_thenThrowDataIntegrityViolationExceptionAndRollback": "Переполнение счётчика платежей откатывает весь импорт||Импортировать валидные данные и затем две строки, сумма счётчиков которых переполняется|Проверить исключение, прежний профиль и агрегаты|Ожидается DataIntegrityViolationException и откат изменений."
"alpha.business.insight.core.migration.CsvStartupMigrationIntegrationTest$ApplicationStartup#givenPackagedCsv_whenStartAndRestartApplication_thenImportOnceAndPreserveChanges": "Комплектные CSV мигрируют ровно один раз||Запустить приложение на чистой схеме и проверить контрольные объёмы данных|Изменить импортированные значения и перезапустить приложение|Ожидается неизменный changeset, сохранённые ручные правки и прежнее число платежей."
"alpha.business.insight.core.migration.CsvStartupMigrationIntegrationTest$MigrationExecution#givenRejectedCsvRows_whenMigrate_thenRollbackAndAllowRetry": "Неудачная миграция CSV откатывается и повторяется после исправления||Запустить changeset с ошибочными строками и проверить отсутствие частичных таблиц|Исправить тестовые файлы и выполнить миграцию повторно|Ожидается первая ошибка без отметки changeset и успешный повтор с двумя компаниями, связью и платежом."
"alpha.business.insight.core.qa.dataimport.CsvPackagedSmokeTest#TestSmokePackagedCsvProfile": "Профиль из комплектного CSV доступен через реальный API||Получить токен директора Keycloak и временно выдать доступ к U_67|Запросить контекст компании по HTTP|Ожидаются status 200, профиль AVAILABLE с ОКВЭД 46.51 и региональными данными из CSV."

# Documents: analysis contracts and local storage
"alpha.business.insight.core.qa.documents.DocumentListControllerTest#listDefaultsToNewestDocumentsFirst": "Список PDF по умолчанию начинается с новых документов||Настроить пустую первую страницу репозитория с размером 20 и сортировкой uploadedAt и id по убыванию|Запросить список документов от имени администратора|Ожидаются пустая страница с индексом 0, размером 20 и нулём элементов."
"alpha.business.insight.core.qa.documents.DocumentListControllerTest#listReturnsRequestedPageAndPublicMetadata": "Список PDF поддерживает страницы и безопасные метаданные||Подготовить документ с внутренним путём в JPA-сущности и вторую страницу размера 2|Запросить список с сортировкой title по возрастанию|Ожидаются параметры страницы и публичные поля метаданных; filePath не возвращается."
"alpha.business.insight.core.qa.documents.DocumentListControllerTest#listRequiresAuthentication": "Список PDF требует входа||Подготовить анонимный запрос|Запросить административный список PDF|Ожидается HTTP 401."
"alpha.business.insight.core.qa.documents.DocumentListControllerTest#listRejectsCompanyDirector": "Список PDF доступен только системному администратору||Подготовить JWT роли COMPANY_DIRECTOR|Запросить административный список PDF|Ожидается HTTP 403."
"alpha.business.insight.core.qa.documents.DocumentListControllerTest#openApiDescribesDocumentListAndPagination": "Swagger описывает список PDF и параметры страниц||Инициализировать Spring MVC и OpenAPI|Получить публичную спецификацию и проверить GET /admin/documents|Ожидаются ответ 200 и параметры page, size, sort."
"alpha.business.insight.core.qa.documents.unit.DocumentAnalysisContractTest#TestUnitAcceptValidChunksAcrossPages": "Контракт принимает корректные чанки и векторы||Создать две страницы текста с последовательными ordinal и конечными векторами|Проверить результат validate|Ожидается отсутствие исключения."
"alpha.business.insight.core.qa.documents.unit.DocumentAnalysisContractTest#TestUnitRejectInvalidAnalysisContract": "Контракт анализа отклоняет некорректные значения||Проверить чужой documentId, неизвестную версию, неверные размерности, страницы и ordinal|Проверить пустые и null-значения, повтор ordinal и невалидные векторы|Для каждого сценария ожидается IllegalArgumentException."
"alpha.business.insight.core.qa.documents.unit.DocumentServiceTest#TestUnitUploadPdfAndPersistMetadata": "Успешная загрузка сохраняет PDF и метаданные||Загрузить PDF через локальную ML-заглушку с названием и датой публикации|Сверить оригинальные байты, SHA-256, имя, дату и индексирование|Ожидаются нормализованное название, безопасное имя rates.pdf, один чанк и неизменённый файл."
"alpha.business.insight.core.qa.documents.unit.DocumentServiceTest#TestUnitUploadWithoutFilenameUsesDefault": "Пустые имена получают безопасное значение по умолчанию||Загрузить PDF без имени и с пустым названием|Проверить метаданные документа|Ожидается имя файла и название document.pdf."
"alpha.business.insight.core.qa.documents.unit.DocumentServiceTest#TestUnitRejectControlFilenameBeforeWrites": "Управляющий символ в имени отклоняется до побочных эффектов||Загрузить файл с управляющим символом в имени|Проверить статус, файловое хранилище, анализатор и репозиторий|Ожидается BAD_REQUEST, файл и запись не создаются, анализатор не вызывается."
"alpha.business.insight.core.qa.documents.unit.DocumentServiceTest#TestUnitCleanupAfterAnalyzerFailure": "Недоступность ML возвращает 503 и очищает PDF||Смоделировать исключение анализатора и загрузить PDF|Проверить статус ошибки и отсутствие артефактов|Ожидается SERVICE_UNAVAILABLE, удалённый оригинал и отсутствие записи и вызова удаления Qdrant."
"alpha.business.insight.core.qa.documents.unit.DocumentServiceTest#TestUnitRejectForeignAnalysisDocumentId": "Некорректный ответ анализа очищает исходный файл||Передать ответ ML с чужим documentId|Проверить отклонение ответа и очистку хранилищ|Ожидается BAD_GATEWAY, удалённый файл, отсутствие индексации и сохранённых метаданных."
"alpha.business.insight.core.qa.documents.unit.DocumentServiceTest#TestUnitCleanupAfterVectorFailure": "Ошибка векторного индекса удаляет внешние артефакты||Смоделировать отказ индексации после анализа PDF|Проверить cleanup и отсутствие сохранения в репозитории|Ожидается удаление оригинала и запрос на удаление точек документа."
"alpha.business.insight.core.qa.documents.unit.DocumentServiceTest#TestUnitReturnNotFoundForUnknownDocument": "Отсутствующий документ возвращает 404||Настроить пустой ответ репозитория для UUID|Запросить метаданные документа|Ожидается ResponseStatusException со статусом NOT_FOUND."
"alpha.business.insight.core.qa.documents.unit.DocumentServiceTest#TestUnitRejectUnreadableUpload": "Ошибка чтения загружаемого файла возвращает 400||Смоделировать IOException при чтении MultipartFile|Проверить статус и файловое хранилище|Ожидается BAD_REQUEST и отсутствие файлов."
"alpha.business.insight.core.qa.documents.unit.DocumentStorageTest#TestUnitStoreAndReadPdfBytes": "Новое PDF хранится по UUID и читается исходными байтами||Записать PDF в пустое временное хранилище|Проверить вложенный путь и байты при чтении|Ожидаются каталоги из первых шести символов UUID и побайтно совпадающий оригинал."
"alpha.business.insight.core.qa.documents.unit.DocumentStorageTest#TestUnitPreventOverwriteOfStoredPdf": "Повторная запись UUID не заменяет оригинал||Записать файл и повторить запись с тем же UUID|Проверить исключение и сохранённое содержимое|Ожидается FileAlreadyExistsException и прежние байты."
"alpha.business.insight.core.qa.documents.unit.DocumentStorageTest#TestUnitDeleteMissingPdfIdempotently": "Повторная очистка отсутствующего файла безопасна||Удалить несуществующий путь дважды|Проверить каталог хранилища|Ожидается пустое хранилище без исключения."
"alpha.business.insight.core.qa.documents.unit.DocumentStorageTest#TestUnitRejectStoragePathTraversal": "Очистка пути за корнем хранилища запрещена||Передать путь с переходом к родительскому каталогу|Проверить исключение|Ожидается IllegalArgumentException."
"alpha.business.insight.core.qa.documents.unit.DocumentStorageTest#TestUnitReadLegacyFlatPdf": "Чтение поддерживает прежнее плоское расположение PDF||Создать файл по старому пути в корне хранилища|Прочитать документ по UUID|Ожидаются исходные байты файла."
"alpha.business.insight.core.qa.documents.DocumentUploadSmokeTest#TestSmokePdfUploadRoundTrip": "Реальная загрузка сохраняет PDF, метаданные и stub-чанк||Получить реальные JWT администратора и директора, затем проверить запреты и загрузить валидный PDF администратором|Получить метаданные и оригинал через API, сверить байты и прочитать payload/vector в Qdrant|Ожидается сохранённый документ и один чанк; stub=true, stub-v1 и [ML STUB] явно показывают синтетический результат без анализа содержимого PDF."
"alpha.business.insight.core.qa.documents.DocumentUploadHttpE2eTest#TestE2EDocumentAccessRules": "Запись доступна только администратору, чтение требует JWT||Отправить загрузку с JWT директора и запросить документ без токена|Проверить статусы ответов|Ожидаются 403 для директора и 401 для анонимного запроса."
"alpha.business.insight.core.qa.documents.DocumentConcurrencyHttpE2eTest#TestE2EConcurrentPdfUploadsKeepArtifactsIndependent": "Параллельные загрузки PDF сохраняют независимые артефакты||Одновременно загрузить несколько разных PDF|Сверить идентификаторы документов, метаданные, оригиналы и чанки|Каждая загрузка сохраняет собственные байты и связанные записи без смешивания артефактов."

# Documents: analyzer and PostgreSQL/Qdrant integration
"alpha.business.insight.core.document.DocumentAnalyzerFeignTest#defaultsToLocalStubWithoutHttpClient": "При стандартной настройке выбирается локальная заглушка||Создать контекст с конфигурацией по умолчанию|Проверить единственный bean DocumentAnalyzer|Ожидается StubDocumentAnalyzer без HTTP-клиента."
"alpha.business.insight.core.document.DocumentAnalyzerFeignTest#feignSendsPdfAndDocumentIdAndDecodesAnalysis": "Feign отправляет PDF и декодирует результат анализа||Запустить локальный HTTP-ответчик с результатом контракта|Вызвать DocumentAnalyzer и проверить полученные сервером заголовок, путь и байты|Ожидаются application/pdf, путь с documentId и исходный DocumentAnalysis."
"alpha.business.insight.core.document.DocumentAnalyzerFeignTest#feignPropagatesServiceErrorWithoutRetryingUpload": "Ошибка ML возвращается вызывающему коду без повтора||Ответить 503 на запрос анализа|Вызвать анализ и посчитать число запросов|Ожидается FeignException и ровно один запрос."
"alpha.business.insight.core.document.DocumentStorageTest#storesPdfInThreeDirectoriesFromFirstSixUuidCharacters": "Хранилище распределяет PDF по первым шести символам UUID||Записать PDF и прочитать его из вложенного каталога|Удалить файл по вычисляемому относительному пути|Ожидаются исходные байты и отсутствие файла после удаления."
"alpha.business.insight.core.document.DocumentStorageTest#stillReadsPreviouslyUploadedFlatFiles": "Старый плоский путь остаётся читаемым||Записать PDF в корень под именем UUID|Прочитать документ через DocumentStorage|Ожидаются исходные байты."
"alpha.business.insight.core.document.DocumentStorageTest#rejectsCleanupPathsOutsideStorage": "Очистка не выходит за пределы хранилища||Передать относительный путь к соседнему файлу|Проверить тип результата|Ожидается IllegalArgumentException."
"alpha.business.insight.core.document.DocumentStorageConcurrencyTest#TestIntegrationConcurrentWritesKeepSingleWinner": "Конкурентная запись одного UUID сохраняет единственный полный PDF||Одновременно записать два набора синтетических байтов по одному UUID|Проверить один успешный исход, отказ FileAlreadyExistsException, содержимое победителя и число файлов|Ожидается один полный файл без смешивания байтов; проверяется файловое production-хранилище без HTTP и AI."
"alpha.business.insight.core.document.DocumentStorageConcurrencyTest#TestIntegrationConcurrentDocumentsKeepOwnBytes": "Разные UUID с общим префиксом сохраняют независимые PDF||Одновременно записать синтетические PDF по разным UUID с общим префиксом|Проверить байты обоих файлов и число файлов|Ожидаются две независимые полные записи в общем каталоге; проверяется файловое production-хранилище без HTTP и AI."
"alpha.business.insight.core.document.DocumentUploadIntegrationTest#openApiDescribesMetadataWithoutPostgresFragmentFields": "OpenAPI публикует безопасную схему метаданных||Получить OpenAPI через MockMvc|Проверить описания размера, SHA-256, количества чанков и отсутствие внутренних полей|Ожидаются публичные поля контракта и документированное название загрузки."
"alpha.business.insight.core.document.DocumentUploadIntegrationTest#uploadStoresOnlyMetadataInPostgresAndTextAlongsideVectorInQdrant": "PDF, метаданные и vector payload распределяются по хранилищам||Загрузить PDF как системный администратор|Проверить PostgreSQL, оригинал, Qdrant payload/vector и ответы на чтение для обеих ролей|Ожидаются метаданные в PostgreSQL, оригинал в файловом хранилище и помеченный ML STUB чанк в Qdrant."
"alpha.business.insight.core.document.DocumentUploadIntegrationTest#multipleChunksPreserveTheirTextsPagesAndIndependentIds": "Несколько чанков сохраняют страницы и независимые идентификаторы||Вернуть анализ с двумя страницами и загрузить PDF|Прочитать второй чанк по его ID|Ожидаются два чанка, страница 3 и текст соответствующего фрагмента."
"alpha.business.insight.core.document.DocumentUploadIntegrationTest#uploadRequiresAdminAndUnknownDocumentReturns404": "Загрузка требует администратора, неизвестный документ возвращает 404||Выполнить загрузку без токена и с ролью директора|Запросить неизвестный UUID с токеном директора|Ожидаются 401, 403 и 404 без новых документов."
"alpha.business.insight.core.document.DocumentUploadIntegrationTest#rejectsEmptyNonPdfAndOversizedFileBeforeCreatingArtifacts": "Пустой, не PDF и превышающий лимит файлы отклоняются||Загрузить файлы размером 0, 3 байта и свыше 50 МБ|Проверить статусы, записи и файлы|Ожидаются 400, 415 и 413 без созданных артефактов."
"alpha.business.insight.core.document.DocumentUploadIntegrationTest#invalidMlResponseCancelsUpload": "Некорректный ответ ML отменяет загрузку||Для каждого fault-сценария вернуть неверный ID, ordinal, размерность, NaN или пустой список|Проверить HTTP ответ и побочные эффекты|Ожидаются 502, отсутствие метаданных и очищенный файловый оригинал."
"alpha.business.insight.core.document.DocumentUploadIntegrationTest#mlUnavailableReturns503AndCleansArtifacts": "Недоступность ML отменяет загрузку с возможностью повтора||Смоделировать сбой вызова ML и загрузить PDF с JWT администратора|Проверить HTTP-статус, retryable и побочные эффекты|Ожидаются 503, ML_UNAVAILABLE, retryable=true, отсутствие метаданных и очищенный файловый оригинал."
"alpha.business.insight.core.document.DocumentUploadIntegrationTest#partialQdrantWriteDeletesChunksAndOriginalWithoutSavingMetadata": "Частичная запись Qdrant компенсируется||Выполнить реальную запись точки и затем смоделировать отказ|Проверить документы, точки Qdrant и файл|Ожидается отсутствие метаданных, чанков и оригинала."
"alpha.business.insight.core.document.DocumentUploadIntegrationTest#metadataCommitFailureDeletesAlreadyIndexedChunksAndOriginal": "Ошибка фиксации метаданных компенсирует внешние записи||Создать отложенный триггер, завершающий вставку документа ошибкой|Загрузить документ и проверить очистку всех хранилищ|Ожидается отсутствие записи, точки Qdrant и исходного файла."
"alpha.business.insight.core.document.DocumentUploadIntegrationTest#concurrentUploadsKeepDocumentAndChunkIdsIndependent": "Параллельные загрузки получают независимые UUID документов и чанков||Запустить четыре загрузки одновременно|Сверить название каждого документа и точки Qdrant|Ожидаются четыре сохранённых документа с отдельными точками."

# Security: role policy and real Keycloak E2E
"alpha.business.insight.core.security.SecurityConfigTest#givenNoToken_whenGetOpenApi_thenReturnApiWithKeycloakLogin": "OpenAPI доступен без авторизации и описывает вход Keycloak||Запросить публичную OpenAPI спецификацию|Проверить серверный префикс, маршруты, OAuth URLs и scope|Ожидается схема OAuth2 с authorization code и scope openid."
"alpha.business.insight.core.security.SecurityConfigTest#givenNoToken_whenGetSwaggerUi_thenReturnUiAndConfiguration": "Swagger UI и его конфигурация доступны без токена||Получить страницу, redirect, initializer, OAuth redirect и swagger config|Проверить адрес API и настройки клиента с PKCE|Ожидаются открытые страницы и clientId alfa-backend с prompt login."
"alpha.business.insight.core.security.SecurityConfigTest#givenNoToken_whenGetOpenApiYaml_thenReturnSpecification": "OpenAPI YAML доступен анонимно||Запросить YAML endpoint|Проверить наличие маршрута auth/me|Ожидается HTTP 200 и спецификация API."
"alpha.business.insight.core.security.SecurityConfigTest#givenNoToken_whenRequest_thenUnauthorized": "Защищённые маршруты требуют JWT||Запросить auth/me и административный маршрут без токена|Проверить статусы|Ожидаются 401 для обоих маршрутов."
"alpha.business.insight.core.security.SecurityConfigTest#givenInvalidToken_whenRequest_thenUnauthorized": "JWT с ошибкой декодирования отклоняется||Настроить декодер на BadJwtException|Выполнить запрос с bearer invalid|Ожидается 401."
"alpha.business.insight.core.security.SecurityConfigTest#givenApplicationRole_whenGetMe_thenReturnIdentity": "Поддерживаемые роли видят идентификатор и имя пользователя||Для SYSTEM_ADMIN и COMPANY_DIRECTOR выдать тестовый JWT|Запросить auth/me|Ожидаются HTTP 200, subject, имя demo и переданная роль."
"alpha.business.insight.core.security.SecurityConfigTest#givenNoApplicationRole_whenGetMe_thenForbidden": "JWT без разрешённой роли запрещён||Проверить JWT без ролей и с OTHER_ROLE|Запросить auth/me|Ожидается 403 для обоих вариантов."
"alpha.business.insight.core.security.SecurityConfigTest#givenDirector_whenAdminRequest_thenForbidden": "Роль директора не открывает административный маршрут||Выдать JWT COMPANY_DIRECTOR|Запросить /admin/check|Ожидается 403."
"alpha.business.insight.core.security.SecurityConfigTest#givenAdmin_whenAdminRequest_thenAllowed": "Системный администратор открывает административный маршрут||Выдать JWT SYSTEM_ADMIN|Запросить /admin/check|Ожидается HTTP 200."
"alpha.business.insight.core.qa.security.BackendAuthorizationSmokeTest#TestSmokeKeycloakRealmRoles": "Реальные токены Keycloak проходят аутентификацию и содержат роли||Запросить /auth/me без токена|Получить токены директора и администратора через тестовый realm и проверить ответы|Ожидается 401 без токена и роли COMPANY_DIRECTOR и SYSTEM_ADMIN в реальных JWT."

# Database schema integration
"alpha.business.insight.core.migration.AnalysisSchemaIntegrationTest#givenAnalysisGraph_whenPersistAndReload_thenPreserveDataAndRelations": "Сущности события и анализа сохраняют данные и связи||Сохранить event, insight с актуальным JSON-контрактом, диалог, feedback и доступ пользователя к компании|Очистить persistence context и загрузить сущности повторно|Ожидаются исходные поля JSONB, enum, связи, суммы и текстовые поля; схема формы JSON здесь не валидируется."
"alpha.business.insight.core.migration.AnalysisSchemaIntegrationTest#givenCachedInsight_whenInsertVersion_thenEnforceCacheKey": "Ключ кэша допускает новую версию материала||Создать событие и инсайты для версий 1 и 2|Повторно вставить версию 1|Ожидаются две записи и ограничение уникальности для повторной версии."
"alpha.business.insight.core.migration.AnalysisSchemaIntegrationTest#whenInspectSchema_thenChunksAreNotStoredInPostgres": "Чанки и очередь очистки не хранятся в PostgreSQL||Проверить прикладную схему таблиц|Найти fragments, facts и document_upload_cleanup|Ожидается отсутствие всех трёх таблиц."
"alpha.business.insight.core.migration.AnalysisSchemaIntegrationTest#whenInspectSchema_thenEveryTableAndColumnHasComment": "Таблицы и колонки прикладной схемы документированы||Проверить комментарии таблиц и колонок в системном каталоге PostgreSQL|Исключить только системные таблицы Liquibase|Ожидаются комментарии у каждой прикладной таблицы и колонки."

# HTTP evidence safety
"alpha.business.insight.core.qa.connectors.HttpEvidenceTest#TestUnitPreserveSafeHttpEvidence": "Безопасный HTTP evidence сохраняется||Подготовить HTTP evidence со статусом, URL, именем пользователя и типом содержимого|Применить редактирование evidence|Проверить, что все безопасные диагностические поля доступны без изменений"
"alpha.business.insight.core.qa.connectors.HttpEvidenceTest#TestUnitPreserveEncodedAndRepeatedQueryParameters": "HTTP-клиент передаёт query-параметры без потери значений||Запустить локальный HTTP-приёмник и отправить GET с encoded значениями и повторным параметром|Проверить фактический путь и декодированные параметры запроса|Ожидаются исходное значение с пробелами, амперсандом, плюсом и процентом и оба значения повторного ключа"
"alpha.business.insight.core.qa.connectors.HttpEvidenceTest#TestUnitRedactAuthorizationCredentials": "Учётные данные Authorization скрываются||Подготовить заголовки Authorization с Bearer и Basic значениями|Применить редактирование evidence|Проверить, что оба значения секрета отсутствуют в результате"
"alpha.business.insight.core.qa.connectors.HttpEvidenceTest#TestUnitRedactCookieHeaders": "Значения cookie скрываются в HTTP evidence||Подготовить заголовки Cookie и Set-Cookie с секретными значениями|Применить редактирование evidence|Проверить отсутствие значений cookie и сохранение безопасных атрибутов"
"alpha.business.insight.core.qa.connectors.HttpEvidenceTest#TestUnitRedactJsonSecretsAndPreserveContext": "Секреты JSON скрываются при сохранении диагностического контекста||Подготовить HTTP evidence с токенами, паролем, client secret и безопасными полями|Применить редактирование evidence|Проверить отсутствие всех секретов и сохранность статуса, URL, типа содержимого и имени пользователя"
"alpha.business.insight.core.qa.connectors.HttpEvidenceTest#TestUnitRedactUrlEncodedPassword": "Пароль формы скрывается в URL-encoded теле||Подготовить form-urlencoded evidence с закодированным паролем и безопасными параметрами|Применить редактирование evidence|Проверить отсутствие исходного и закодированного секрета при сохранении логина и контекста запроса"
"alpha.business.insight.core.qa.documents.integration.DocumentAnalyzerJsonContractTest#TestIntegrationRejectStringEmbedding": "Feign отклоняет строковую координату embedding||Запустить локальный HTTP endpoint на случайном loopback-порту и подготовить валидный stub-v1 JSON с одной строковой координатой|Передать синтетический PDF через production Feign DocumentAnalyzer|Ожидается DecodeException; JSON с числовой строкой не принимается согласно ML-контракту"
"alpha.business.insight.core.qa.connectors.HttpEvidenceTest#TestUnitRedactMultipartSecrets": "Секреты multipart-полей скрываются полностью||Подготовить значения password с запятой, кавычками и переносом строки, безопасное название файла и текстовое поле с вложенным паролем|Сформатировать каждое поле через HttpEvidence.formField|Проверить отсутствие секретов, сохранение безопасного названия и маскирование вложенного пароля"

# Актуальные контуры backend и реальный Python ML
"alpha.business.insight.core.event.EventApiIntegrationTest#givenAdmin_whenCreateEvent_thenPersistAndReturnReadableEvent": "Создание события с разными типами источников||Отправить запрос от системного администратора для TEXT, URL и PDF с односимвольным Unicode-заголовком.|Проверить поля ответа, начальный статус и версию материалов.|Сверить запись PostgreSQL, Location и чтение события директором.|Событие сохранено с PROCESSING и версией 1; ответ и запись БД согласованы, Location ведёт на созданное событие."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenClientSuppliedMetadata_whenCreate_thenUseServerMetadata": "Системные поля события задаёт сервер||Отправить тело с клиентскими id, status, createdAt и materialsVersion.|Проверить выданные сервером значения.|Сервер игнорирует клиентские системные поля и создаёт событие со своим id, временем, статусом PROCESSING и версией 1."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenInvalidBody_whenCreateEvent_thenBadRequestWithoutSaving": "Отклонение некорректных тел события||Отправить отсутствующие, пустые, неверно типизированные и недопустимые поля события.|Проверить HTTP 400 и отсутствие записи в БД.|Каждое некорректное тело получает 400; событие не сохраняется."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenNoBody_whenCreate_thenBadRequest": "Отклонение запроса без тела||Отправить POST создания события без тела.|Ответ 400, событие не создаётся."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenNonAdmin_whenCreateEvent_thenForbiddenWithoutSaving": "Создание события доступно администратору||Отправить запросы директора и роли без прав.|Проверить 403 и число сохранённых событий.|Неадминистратор получает 403; событие не сохраняется."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenNoToken_whenAccessEvents_thenUnauthorized": "Авторизация для API событий||Без JWT вызвать создание, список и чтение события.|Все закрытые endpoints возвращают 401."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenEvents_whenListAndRead_thenReturnNewestFirstWithStableOrder": "Сортировка и чтение событий||Создать три события с уникальным общим префиксом заголовка, разными датами и одинаковой датой.|Запросить страницу по префиксу, затем прочитать конкретное событие от имени администратора и директора.|Page содержит ровно три совпавших события с totalElements=3, отсортированных по createdAt убыванию и затем id убыванию; компактный список не раскрывает sourceRef и materialsVersion, детальное чтение возвращает сохранённые поля."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenNoEvents_whenList_thenReturnEmptyArray": "Пустая страница событий||Запросить список от имени директора с title, для которого нет совпадений.|Проверить содержимое и метаданные Page.|HTTP 200; content пуст, number=0, size=20 и totalElements=0."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenUnknownEvent_whenGet_thenNotFound": "Чтение неизвестного события||Запросить отсутствующий UUID от имени администратора.|API возвращает 404."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenInvalidId_whenGet_thenBadRequest": "Некорректный UUID события||Запросить событие с невалидным идентификатором.|API возвращает 400."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenUnrelatedRole_whenRead_thenForbidden": "Чтение событий ограничено ролями||Запросить список и конкретное событие с посторонней ролью.|Оба запроса возвращают 403."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#repeatedPostAndGetReturnSameInsightWithoutNewLlmCalls": "Кэширование инсайта и повторное чтение||Сгенерировать инсайт POST, повторить POST и прочитать GET.|Проверить JSON-поля, одинаковый результат и число обращений LLM.|Повторные запросы возвращают сохранённый результат без дополнительных вызовов LLM; обязательные поля контракта присутствуют."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#newMaterialsVersionRequiresNewGeneration": "Инвалидация инсайта при новой версии материалов||Сгенерировать инсайт, увеличить materials_version события и вызвать GET, затем POST.|Сверить идентификаторы и количество записей.|Старый кэш для текущей версии недоступен; POST создаёт новую запись и trace_id."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#concurrentPostsShareOneGeneration": "Единая генерация для параллельных запросов||Параллельно отправить два POST для одной компании и события.|Подтвердить две транзакции с ожиданием row lock, сравнить ответы и число сохранённых записей.|Оба запроса возвращают один результат; сохраняется одна генерация и выполняется один вызов стадии plan."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#missingSavedInsightReturns404": "Чтение отсутствующего сохранённого инсайта||Вызвать GET для компании и события без сохранённого инсайта.|API возвращает 404."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#rejectsAnonymousAndDirectorWithoutCompanyAccess": "Доступ директора ограничен правами компании||Без токена вызвать POST; затем удалить грант директора и вызвать POST и GET.|Аноним получает 401; директор без доступа получает 403 на чтение и генерацию."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#administratorCanGenerateWithoutCompanyGrant": "Генерация инсайта системным администратором||Удалить грант пользователя на компанию и отправить POST от администратора.|Системный администратор получает успешный ответ без гранта компании."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#unknownCompanyOrEventReturns404": "Неизвестная компания или событие||Запросить генерацию для неизвестной компании, затем для неизвестного события.|Оба запроса возвращают 404."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#qdrantFragmentsReachPromptButSyntheticBankViewIsRemoved": "Валидация источников инсайта||Индексировать синтетический банковский фрагмент и подменить ответ модели неподтверждённой позицией и фактом.|Проверить результат и сохранённую запись.|Синтетические/неподтверждённые факты и позиция банка удалены; источники пусты, поскольку подтверждённых цитат нет; исходный текст фрагмента не попадает в сохранённый payload."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#TestIntegrationQdrantScoreThreshold": "Порог оценки Qdrant исключает границу и меньшие значения||Индексировать три контролируемых вектора с оценками 0.64, 0.65 и 0.66.|Проверить оценку Qdrant и содержимое фрагментов в запросе LLM.|Фрагмент с оценкой 0.66 передаётся LLM; 0.64 и 0.65 отсекаются."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#failedLlmDoesNotCacheIncompleteInsight": "Повтор генерации после ошибки LLM||Смоделировать ошибку LLM при revision.|Проверить ответ, отсутствие кэша и повторить запрос после восстановления клиента.|Возвращается 503 с LLM_UNAVAILABLE и retryable=true; неполный инсайт не сохраняется, повторная генерация успешна."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#failedMlDoesNotSaveInsightAndCanBeRetried": "Повтор генерации после ошибки ML||Смоделировать ошибку embedding, проверить ответ и отсутствие сохранения.|Восстановить ML-заглушку и повторить POST.|Возвращается 503 с ML_UNAVAILABLE и retryable=true; данные ошибки не сохраняются как инсайт, повтор успешен."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#failedQdrantDoesNotSaveInsightAndCanBeRetried": "Повтор генерации после ошибки Qdrant||Приостановить Qdrant, отправить POST и измерить задержку.|Проверить ответ и отсутствие записи; возобновить Qdrant и повторить.|Возвращается 503 с QDRANT_UNAVAILABLE и retryable=true в пределах таймаута; запись не сохраняется, повтор успешен."
"alpha.business.insight.core.insight.InsightValidatorTest#removesUnretrievedFactsAndBankViewFromNonBankSources": "Проверка привязки фактов и позиции банка||Передать подтверждённый и неподтверждённые факты и позицию банка по не банковскому источнику.|Проверить оставшиеся записи, ссылки и missing_data.|Остаётся только подтверждённый факт; позиция банка удалена, выдуманный источник исключён, причина удаления указана."
"alpha.business.insight.core.insight.InsightValidatorTest#acceptsBankReferencesOnlyFromRealBankMaterial": "Позиция банка требует реального материала||Проверить позицию со ссылкой на реальный BANK_ANALYTICS и на stub-фрагмент.|Проверить страницы и источники.|Реальный банковский материал допустим и представлен без текста фрагмента; stub-позиция удалена."
"alpha.business.insight.core.insight.InsightValidatorTest#removesSyntheticFactsAndNormalizesInferenceGrounding": "Фильтрация stub-фактов и обоснования выводов||Передать факт со stub-источником и вывод с выдуманной ссылкой.|Проверить факты, based_on, confidence, missing_data и cost.|Stub-факт удалён; неподтверждённое обоснование очищено, confidence понижен до low; missing_data и cost сохранены."
"alpha.business.insight.core.insight.InsightValidatorTest#discardsNestedSourceCopiesFromModelOutput": "Удаление вложенных копий исходного текста||Поместить текст фрагмента во вложенные поля ответа модели.|Проверить нормализованные поля результата.|Сырой текст фрагмента отсутствует в выходном JSON; допустимые утверждения и features_used сохранены."
"alpha.business.insight.core.insight.LlmClientTest#disabledChatUsesStubWithoutCreatingRemoteModel": "Заглушка модели при отключённом чате||Запустить ApplicationContext с spring.ai.model.chat=none.|Проверить отсутствие OpenAiChatModel и ответ stub-клиента.|Удалённая модель не создаётся; клиент возвращает stub-ответ."
"alpha.business.insight.core.insight.LlmClientHttpIntegrationTest#sendsOpenAiCompatibleRequestAndReadsJson": "Совместимый OpenAI запрос и JSON ответ||Поднять локальный HTTP-сервер и вызвать клиент с JSON-контекстом.|Проверить путь, авторизацию, модель, лимит токенов, формат JSON и распарсенный ответ.|Клиент отправляет совместимый запрос на /v1/chat/completions с заданными заголовками и параметрами и читает JSON-ответ."
"alpha.business.insight.core.insight.LlmClientTest#disabledChatUsesStubEvenWithRemoteSettingsAndEmptyKey": "Отключённый чат не создаёт удалённую модель||Задать chat=none, пустой ключ и удалённый URL.|Проверить отсутствие OpenAiChatModel и stub-ответ.|Клиент остаётся stub и не создаёт удалённую модель."
"alpha.business.insight.core.insight.LlmClientHttpIntegrationTest#stalledLlmCallTimesOutWithoutRetry": "Тайм-аут вызова LLM без повтора||Запустить локальный сервер, который удерживает запрос дольше установленного тайм-аута.|Проверить статус исключения, длительность и число запросов.|Вызов завершается 503 до трёх секунд и не повторяется."
"alpha.business.insight.core.insight.LlmClientHttpIntegrationTest#budgetErrorIsNotRetriedAndDoesNotExposeProviderBody": "Скрытие ошибки провайдера без повтора||Ответить локального сервера HTTP 429 с секретным телом.|Проверить статус, отсутствие секрета/ключа в исключении и число запросов.|Клиент возвращает 503, не раскрывает тело провайдера или API-ключ и выполняет ровно один запрос."
"alpha.business.insight.core.controller.ApiExceptionHandlerTest#businessErrorPreservesStatusAndRussianMessage": "Формат бизнес-ошибки API||Вызвать endpoint, выбрасывающий NOT_FOUND с русским сообщением.|Проверить код, сообщение, retryable и отсутствие detail.|Ответ сохраняет статус 404, код NOT_FOUND и сообщение; retryable=false, внутренний detail отсутствует."
"alpha.business.insight.core.controller.ApiExceptionHandlerTest#unexpectedErrorDoesNotExposeDetails": "Сокрытие внутренних ошибок API||Вызвать endpoint с неожиданным исключением.|Проверить стабильный формат ответа и отсутствие исходной детали.|Ответ 500 содержит INTERNAL_ERROR и общее сообщение, не раскрывая secret."
"alpha.business.insight.core.controller.ApiExceptionHandlerTest#oversizedMultipartUsesSameFormat": "Единый формат ошибки размера загрузки||Вызвать обработчик ошибки загрузки свыше лимита.|Проверить статус, код, сообщение и retryable.|Ответ 413 содержит PAYLOAD_TOO_LARGE, русское сообщение о лимите 50 МБ и retryable=false."
"alpha.business.insight.core.controller.ApiExceptionHandlerTest#malformedJsonAndInvalidUuidUseBadRequest": "Ошибки некорректного JSON и UUID||Отправить синтаксически неверный JSON и невалидный UUID.|Проверить 400 и код BAD_REQUEST.|Обе ошибки возвращают 400 с BAD_REQUEST; retryable=false для JSON."
"alpha.business.insight.core.controller.ApiExceptionHandlerTest#unsupportedMethodPreservesAllowHeader": "Формат ошибки неподдерживаемого метода||Вызвать POST-only endpoint методом DELETE.|Проверить 405, Allow и код ошибки.|Ответ 405 содержит Allow: POST и METHOD_NOT_ALLOWED."
"alpha.business.insight.core.document.QdrantConfigTest#clientCreationDoesNotBlockOnUnresponsiveQdrant": "Создание клиента Qdrant без ожидания сети||Открыть локальный порт TCP без реализации Qdrant.|Создать Qdrant client и проверить тайм-аут операции создания.|Создание клиента завершается не дольше двух секунд и не инициирует блокирующий сетевой вызов."
"alpha.business.insight.core.document.DocumentAnalyzerFeignTest#feignCallsRemoteEmbeddingAndValidatesModel": "Удалённый embedding и проверка модели||Поднять локальный endpoint embeddings и запустить DocumentAnalyzer с ml.stub=false.|Проверить переданный текст, размер/значения вектора и восстановление после 503.|Клиент получает ожидаемый вектор и корректно пробрасывает FeignException при ошибке сервиса; следующий запрос снова успешен."
"alpha.business.insight.core.document.DocumentAnalyzerFeignTest#stalledMlCallTimesOutWithoutRetry": "Тайм-аут ML вызова без повтора||Поднять локальный endpoint, удерживающий ответ.|Проверить исключение, максимальную задержку и число запросов.|Вызов заканчивается по timeout менее чем за три секунды и не повторяется."
"alpha.business.insight.core.qa.documents.integration.RealMlDocumentIntegrationTest#TestIntegrationUploadPdfThroughRealPython": "Настоящий Python извлекает страницы PDF и backend сохраняет результат||Получить JWT администратора и загрузить PDF через POST /api/admin/documents|Прочитать метаданные, чанки Qdrant и скачать оригинал через API|HTTP 201; реальный текст и страницы PDF в Qdrant, метаданные в PostgreSQL, скачанные байты совпадают с исходными; embeddings явно stub-v1."
"alpha.business.insight.core.qa.documents.integration.RealMlDocumentIntegrationTest#TestIntegrationRejectTextlessPdfWithoutArtifacts": "Отказ анализа PDF без текста не сохраняет документ||Загрузить физически корректный PDF без текстового слоя через реальный Python.|Проверить статус API, retryable, метаданные и временный оригинал.|Java возвращает HTTP 422 с retryable=false; документ и оригинал не сохраняются."

"alpha.business.insight.core.qa.documents.integration.RealMlDocumentIntegrationTest#TestIntegrationIndexPublishedBankReport": "Опубликованный PDF ЦБ индексируется с сохранением страниц и фактов||Загрузить оригинальный PDF Банка России через backend и настоящий Python|Проверить PostgreSQL, SHA-256 и чанки Qdrant с числами на физической странице 2|Скачать оригинал через API|HTTP 201; исходный SHA-256 сохранён, значения 12,7% и 9,8% относятся к странице 2, скачанный PDF побайтно совпадает; embeddings явно stub-v1."

"alpha.business.insight.core.qa.documents.integration.RealMlDocumentIntegrationTest#TestIntegrationPdfUploadSizeBoundaries": "HTTP-загрузка PDF на границах 50 МиБ||Восстановить корректный PDF заданного точного размера: 36 МиБ, 50 МиБ минус байт, ровно 50 МиБ, 50 МиБ плюс байт, 51 МиБ|Получить JWT администратора и отправить настоящий HTTP multipart через backend и Python|Для допустимого размера сверить размер и SHA-256 в API, PostgreSQL и файле; на точном лимите скачать оригинал|Для превышения проверить 413, отсутствие новых или частичных файлов/строк и доступность API после отказа|До 52 428 800 байт включительно возвращается 201, оригинал сохранён без изменений; превышение даёт 413 PAYLOAD_TOO_LARGE и retryable=false без побочных эффектов."

"alpha.business.insight.core.qa.dataimport.CsvImportServiceTest#TestUnitAcceptPaymentBoundaryValues": "Граничные допустимые значения платежа||Подготовить корректные строки с суммой и количеством (0,0), (0.01,1), (1,9223372036854775806), (1,9223372036854775807)|Импортировать CSV с перехватом входа COPY|Сверить число принятых и отклонённых строк, сумму численно и точное количество платежей|Все четыре значения допускаются публичной схемой NUMERIC >= 0 и BIGINT >= 0; значение счётчика не теряет точность, отклонённых строк нет."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenFiltersAndPage_whenList_thenCombineFiltersAndPreserveTotals": "Фильтры и пагинация списка событий||Создать события с разными заголовками, статусами и типами источника.|Запросить вторую страницу с комбинированными фильтрами и затем страницу за пределами результата.|Вторая страница содержит Rate B; totalElements=2 и totalPages=2, а пустая страница сохраняет totalElements=2."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenBlankFilters_whenList_thenIgnoreFilters": "Пустые фильтры событий||Создать пять тестовых событий и запросить список без фильтров.|Передать пустую строку, пробел или табуляцию в title, status и sourceType.|Сравнить полные ответы и общее число результатов с непрофильтрованным запросом и количеством событий в БД.|Пустые фильтры игнорируются: Page совпадает с непрофильтрованным ответом, totalElements равен числу сохранённых событий."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenWildcardCharacters_whenList_thenMatchLiteralTitle": "Буквальный поиск специальных символов в заголовке||Добавить событие Rate!%_special и запросить title-фильтр !%_.|Проверить заголовок единственного результата и totalElements.|Символы !, % и _ считаются литералами; найдено только Rate!%_special."
"alpha.business.insight.core.event.EventApiIntegrationTest#givenInvalidFilter_whenList_thenBadRequest": "Отклонение неизвестных фильтров событий||Передать неизвестный status либо sourceType.|Проверить HTTP-статус ответа.|Каждое неизвестное значение фильтра возвращает 400."
"alpha.business.insight.core.qa.company.CompanyListServiceTest#TestUnitTrimsCompanyListFiltersAndPreservesPage": "Пробелы в фильтрах списка компаний удаляются с сохранением страницы||Настроить репозиторий на страницу с одной компанией и totalElements=3.|Передать фильтры с пробелами по краям.|Сервис передаёт очищенные значения, возвращает содержимое и метаданные страницы: номер 1, размер 2, всего 3 элемента и 2 страницы."
"alpha.business.insight.core.qa.company.CompanyListServiceTest#TestUnitIgnoresAbsentCompanyListFilters": "Отсутствующие фильтры списка компаний игнорируются||Для null, пустой строки, пробела и табуляции настроить поиск без фильтров.|Вызвать сервис с одинаковым значением во всех фильтрах.|Репозиторий вызывается с null-фильтрами, сервис возвращает тот же объект страницы."
"alpha.business.insight.core.qa.company.CompanyListServiceTest#TestUnitTreatsCompanyListWildcardsLiterally": "Шаблонные символы в фильтре компании экранируются||Настроить репозиторий на запрос id!!!%!_.|Передать фильтр id!%_.|Сервис экранирует !, % и _ и возвращает страницу репозитория."
"alpha.business.insight.core.qa.company.CompanyListServiceTest#TestUnitPreservesCompanyCountBeyondLastPage": "Число компаний сохраняется за последней страницей||Настроить пустую страницу 3 размера 2 с totalElements=3.|Запросить страницу по фильтру abc.|Содержимое пустое, общее число найденных компаний остаётся равным 3."
"alpha.business.insight.core.qa.company.CompanyControllerTest#TestIntegrationCompanyListUsesDefaultPageAndSort": "Список компаний использует страницу и сортировку по умолчанию||Настроить сервис на пустую страницу 0 размера 20 с сортировкой по id.|Вызвать GET /api/companies без параметров.|HTTP 200; content пуст, number=0, size=20 и totalElements=0."
"alpha.business.insight.core.qa.company.CompanyControllerTest#TestIntegrationCompanyListBindsFiltersAndReturnsCompactDto": "Список компаний связывает фильтры, страницу и компактный DTO||Настроить сервис на страницу 1 размера 2 с сортировкой id по убыванию и одной компанией.|Вызвать GET /api/companies с companyId, city, mainIndustryCode, page, size и sort.|HTTP 200; параметры переданы сервису, метаданные страницы корректны, DTO содержит шесть публичных полей компании."
"alpha.business.insight.core.document.DocumentUploadIntegrationTest#mlRejectsPdfOrIsUnavailableReturnsStatusAndCleansArtifacts": "Статусы отказа и недоступности ML сохраняются без артефактов||Смоделировать ответ ML 422 и 503 и загрузить PDF с JWT администратора.|Проверить HTTP-статус, retryable и код/сообщение ошибки.|Ответ backend сохраняет статус ML; 422 имеет retryable=false и сообщает об отсутствии извлекаемого текста, 503 имеет retryable=true и ML_UNAVAILABLE; строк и файлов не создано."
"alpha.business.insight.core.qa.documents.DocumentVectorStoreCollectionTest#multilingualE5UsesItsOwn384DimensionCollection": "Имя коллекции включает модель и размерность||Указать multilingual-e5-small размерности 384.|Получить имя коллекции Qdrant.|Имя коллекции соответствует модели и размерности, чтобы несовместимые векторы не пересекались."
"alpha.business.insight.core.qa.documents.DocumentVectorStoreCollectionTest#stubCollectionNameRemainsStableForExistingDocuments": "Имя коллекции stub сохраняет совместимость||Указать stub-v1 размерности 8.|Получить имя коллекции Qdrant.|Возвращается прежнее имя knowledge_documents_stub_v1."
"alpha.business.insight.core.insight.InsightValidatorTest#TestUnitDemotesUnreferencedFactToLowConfidenceInference": "Неподтверждённый факт преобразуется в вывод с низкой уверенностью||Передать факт без fragment_id, подтверждённый факт и существующий вывод с валидной ссылкой.|Проверить facts, ai_inference, confidence, based_on и сохранность исходного вывода.|Неподтверждённый текст отсутствует в facts и ровно один раз добавлен в ai_inference с confidence=low и пустым based_on; подтверждённый факт и существующий вывод сохранены."
"alpha.business.insight.core.insight.CompanyInsightContextIntegrationTest#TestIntegrationInsightReceivesSelectedCompanyContextAndIsolatesCache": "Контекст выбранной компании передаётся в инсайт||Подготовить три компании одной группы с разными профилями и направлениями платежей для общего события.|Сгенерировать инсайты через integration pipeline и сверить вход LLM, записи и повторный GET.|Каждый инсайт получает контекст выбранной компании, учитывает общий групповой контекст; записи и кэш независимы для трёх компаний."
"alpha.business.insight.core.qa.insights.ConsumerInsightHttpSmokeTest#TestSmokeConsumerInsightHttpJourney": "Пользовательский HTTP-путь от списка компаний до сохранённого инсайта||Создать компанию и READY-событие, получить токен директора и разрешение на компанию.|Через HTTP найти компанию и событие, проверить отсутствие кэша, сгенерировать инсайт и прочитать его повторно.|Директор проходит весь путь; повторное чтение совпадает с генерацией, запись связана с компанией и событием, заглушки явно помечены."
"alpha.business.insight.core.qa.company.CompanyUsersHttpE2eTest#TestE2ECreditDirectorReadsGrantedCompanyProfile": "Директор читает выданный кредитный профиль||Создать изолированные профили и получить JWT трёх тестовых директоров|Запросить профиль и HTTP-топ компании кредитного директора|Профиль сообщает hasLoan=true и hasForeignTrade=false; профиль и лента доступны с выданным grant."
"alpha.business.insight.core.qa.company.CompanyUsersHttpE2eTest#TestE2ETradeDirectorReadsGrantedCompanyProfile": "Директор читает выданный профиль внешней торговли||Создать изолированные профили и получить JWT трёх тестовых директоров|Запросить профиль и HTTP-топ компании торгового директора|Профиль сообщает hasLoan=false и hasForeignTrade=true, страна Китай; профиль и лента доступны с выданным grant."
"alpha.business.insight.core.qa.company.CompanyUsersHttpE2eTest#TestE2EDirectorCannotReadCompanyWithoutGrant": "Профиль и топ компании доступны только при наличии grant||Создать кредитный, торговый и невыданный профили; получить отдельные JWT директоров|Для CREDIT→trade, TRADE→credit и UNASSIGNED→unassigned отдельно запросить профиль и HTTP-топ|Все шесть запросов без grant возвращают 403; каждый маршрут проверяется отдельным параметрическим вызовом."
"alpha.business.insight.core.qa.company.CompanyUsersHttpE2eTest#TestE2EProcessingEventIsExcludedFromCompanyTop": "HTTP-топ не включает событие в обработке||Создать синтетическое событие с уникальной маркировкой через HTTP от администратора|Запросить HTTP-топ кредитной компании и проверить массив, лимит и отсутствие ID события|Созданное событие имеет статус PROCESSING, топ является массивом не более чем из трёх элементов и не содержит его ID."
"alpha.business.insight.core.qa.events.EventCatalogHttpE2eTest#TestE2ECatalogEventsCreateReadAndList": "Синтетический каталог событий проходит HTTP round-trip||Загрузить и проверить 20 синтетических записей PR65; получить JWT администратора и трёх директоров|Создать и прочитать события через HTTP; проверить фильтры, страницы и доступ директоров|Поля и статус PROCESSING сохраняются; три страницы содержат 7, 7 и 6 записей без повторов, фильтр URL оставляет E20, READY не включает новые события; директоры читают созданные записи."
"alpha.business.insight.core.qa.events.EventCatalogHttpE2eTest#TestE2ECompanyDirectorsCannotCreateCatalogEvents": "Директоры компаний не могут создавать события||Для каждого тестового директора получить JWT и проверить роль через /auth/me|Отправить POST /events и сравнить число записей до и после запроса|Для трёх отдельных пользователей ожидается 403 и отсутствие новой строки события."

"alpha.business.insight.core.company.CompanyContextIntegrationTest#directorCannotReadCompanyWithoutGrant": "Профиль доступен только по привязке||Запросить чужую компанию и участника группы без привязки.|Ожидается 403."

"alpha.business.insight.core.company.CompanyContextIntegrationTest#companyListContainsOnlyGrantedCompaniesWithScopedPagination": "Список учитывает права пользователя||Запросить список с фильтрами и пагинацией от директора, пользователя без привязок и администратора.|Директор видит только свои компании; администратор видит все."
"alpha.business.insight.core.company.CompanyContextIntegrationTest#companyAccessIsScopedToJwtSubject": "Доступ привязан к subject JWT||Выдать второму директору отдельную компанию|Проверить список и профиль обоих директоров, затем отозвать привязку|Чужие компании закрыты с 403; после отзыва список пуст и профиль недоступен."
"alpha.business.insight.core.company.CompanyContextIntegrationTest#directorWithoutSubjectCannotListCompanies": "JWT без subject не открывает список||Подготовить JWT директора без sub|Запросить список компаний|Ожидается 403 без раскрытия общего списка."
"alpha.business.insight.core.qa.company.CompanyListServiceTest#directorWithoutSubjectCannotListCompanies": "Отсутствующий subject не даёт административный доступ||Подготовить JWT директора без sub|Вызвать получение списка компаний|Ожидается отказ 403."
"alpha.business.insight.core.insight.InsightApiIntegrationTest#savedInsightDoesNotBypassCompanyAccess": "Кэш разбора не обходит права компании||Создать разбор от имени директора с привязкой|Запросить его другим директором и после отзыва исходной привязки|Чтение, генерация и история сообщений возвращают 403."
"alpha.business.insight.core.qa.events.NewsIngestionHttpE2eTest#TestE2ENewsCollectionPersistsAndDeduplicates": "Сбор новостей через Python, backend и хранилище||1. Проверить запрет LLM и запустить job с локальными RSS.|2. Сверить сохранённую бизнес-новость и источник.|3. Повторить сбор без нового события.|4. Прочитать событие и список директором.|Одна READY/TEXT-новость, без URL-дубля и спорта, с корректным источником; отказ соседнего RSS не теряет результат; повтор сохраняет ID."

"alpha.business.insight.core.qa.documents.integration.RealMlDocumentIntegrationTest#TestIntegrationUploadMixedTextAndScannedPdfThroughRealPython": "Текстовый слой и OCR скана проходят через весь backend||Загрузить синтетический PDF с русской текстовой страницей и английской страницей-сканом через администратора.|Проверить страницы и контрольные фразы в Qdrant, метаданные PostgreSQL и исходные байты через API.|Повторно загрузить те же байты под новым именем и проверить отдельный documentId с теми же результатами.|Обе загрузки дают HTTP 201 и два чанка на физических страницах 1 и 2; OCR сохраняет контрольные фразы, документы имеют одинаковый SHA-256, а embeddings явно stub-v1."
"alpha.business.insight.core.qa.documents.integration.RealMlDocumentIntegrationTest#TestIntegrationRejectPasswordProtectedPdfWithoutArtifacts": "Зашифрованный PDF отклоняется без сохранения артефактов||Загрузить синтетический PDF с AES-256 защитой через администратора.|Проверить HTTP-контракт отказа и сравнить PostgreSQL, файлы хранения и число точек Qdrant до и после запроса.|Python ML сообщает HTTP 422; ответ не повторяемый, строка документа, файл и новые точки Qdrant не появляются."

"alpha.business.insight.core.qa.events.RankingHttpE2eTest#TestE2ERateEventRanksDifferentlyForLoanAndDepositCompanies": "Персональные последствия решения по ключевой ставке||Создать две компании с разными банковскими продуктами, реальные JWT директора и отдельные grants; добавить READY TEXT новости о ставке, посторонние новости и контрольные события PROCESSING/URL.|Запросить персональный топ обеих компаний через HTTP к Java и настоящий Python ML.|Проверить поля топа, включение события о ставке, риск и объяснение кредита для заёмщика, возможность и объяснение депозита для вкладчика.|Одна новость ранжируется как risk для кредита и opportunity для депозита; каждый scoped grant даёт директору доступ к своей ленте; выдача содержит до трёх READY TEXT-кандидатов с score, эффектом, причиной и состоянием инсайта, а PROCESSING/URL не попадают в топ."
"alpha.business.insight.core.qa.events.RankingHttpE2eTest#TestE2ERateEventExplainsCounterpartyExposure": "Причина ранжирования через платёжного контрагента||Создать профиль компании без прямого фактора ставки, чувствительного автопроизводителя-контрагента и реальные scoped grant директора.|Запросить персональный топ и контекст компании через HTTP.|Проверить событие о ставке, нейтральный эффект при неизвестном направлении риска и объяснение, называющее контрагента-получателя платежей.|ML возвращает событие с why, указывающим на значимого контрагента, а API контекста подтверждает его долю и направление платежей."
