alpha.business.insight.core.security.SecurityConfigTest#givenNoToken_whenGetOpenApi_thenReturnApiWithKeycloakLogin=OpenAPI доступен без авторизации и описывает вход Keycloak||Запросить публичную OpenAPI спецификацию|Проверить серверный префикс, маршруты, OAuth URLs и scope|Ожидается схема OAuth2 с authorization code и scope openid.
alpha.business.insight.core.security.SecurityConfigTest#givenNoToken_whenGetSwaggerUi_thenReturnUiAndConfiguration=Swagger UI и его конфигурация доступны без токена||Получить страницу, redirect, initializer, OAuth redirect и swagger config|Проверить адрес API и настройки клиента с PKCE|Ожидаются открытые страницы и clientId alfa-backend с prompt login.
alpha.business.insight.core.security.SecurityConfigTest#givenNoToken_whenGetOpenApiYaml_thenReturnSpecification=OpenAPI YAML доступен анонимно||Запросить YAML endpoint|Проверить наличие маршрута auth/me|Ожидается HTTP 200 и спецификация API.
alpha.business.insight.core.security.SecurityConfigTest#givenNoToken_whenRequest_thenUnauthorized=Защищённые маршруты требуют JWT||Запросить auth/me и административный маршрут без токена|Проверить статусы|Ожидаются 401 для обоих маршрутов.
alpha.business.insight.core.security.SecurityConfigTest#givenInvalidToken_whenRequest_thenUnauthorized=JWT с ошибкой декодирования отклоняется||Настроить декодер на BadJwtException|Выполнить запрос с bearer invalid|Ожидается 401.
alpha.business.insight.core.security.SecurityConfigTest#givenApplicationRole_whenGetMe_thenReturnIdentity=Поддерживаемые роли видят идентификатор и имя пользователя||Для SYSTEM_ADMIN и COMPANY_DIRECTOR выдать тестовый JWT|Запросить auth/me|Ожидаются HTTP 200, subject, имя demo и переданная роль.
alpha.business.insight.core.security.SecurityConfigTest#givenNoApplicationRole_whenGetMe_thenForbidden=JWT без разрешённой роли запрещён||Проверить JWT без ролей и с OTHER_ROLE|Запросить auth/me|Ожидается 403 для обоих вариантов.
alpha.business.insight.core.security.SecurityConfigTest#givenDirector_whenAdminRequest_thenForbidden=Роль директора не открывает административный маршрут||Выдать JWT COMPANY_DIRECTOR|Запросить /admin/check|Ожидается 403.
alpha.business.insight.core.security.SecurityConfigTest#givenAdmin_whenAdminRequest_thenAllowed=Системный администратор открывает административный маршрут||Выдать JWT SYSTEM_ADMIN|Запросить /admin/check|Ожидается HTTP 200.
alpha.business.insight.core.qa.security.BackendAuthorizationSmokeTest#TestSmokeKeycloakRealmRoles=Реальные токены Keycloak проходят аутентификацию и содержат роли||Запросить /auth/me без токена|Получить токены директора и администратора через тестовый realm и проверить ответы|Ожидается 401 без токена и роли COMPANY_DIRECTOR и SYSTEM_ADMIN в реальных JWT.

