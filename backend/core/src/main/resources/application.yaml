server:
  servlet:
    context-path: /api

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  cloud:
    openfeign:
      client:
        config:
          document-analyzer:
            connectTimeout: 3000
            readTimeout: 110000
  application:
    name: core
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
          audiences: alfa-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/master.xml

qdrant:
  host: ${QDRANT_HOST:localhost}
  grpc-port: ${QDRANT_GRPC_PORT:6334}

company-context:
  top-counterparties: ${COMPANY_CONTEXT_TOP_COUNTERPARTIES:5}

springdoc:
  swagger-ui:
    oauth:
      client-id: alfa-backend
      use-pkce-with-authorization-code-grant: true
      scopes: openid
      additional-query-string-params:
        prompt: login

documents:
  storage-path: ${DOCUMENTS_STORAGE_PATH:./data/documents}

ml:
  stub: ${ML_STUB:true}
  url: ${ML_URL:http://localhost:8000}
