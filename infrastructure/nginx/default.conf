server {
    listen 80;
    server_name localhost;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /auth {
        return 301 /auth/;
    }

    location = /qdrant {
        return 302 /qdrant/dashboard;
    }

    location ^~ /qdrant/ {
        proxy_pass http://qdrant:6333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/javascript text/javascript text/css application/json;
        sub_filter_once off;
        sub_filter '/dashboard/' '/qdrant/dashboard/';
        sub_filter 'path("/collections' 'path("/qdrant/collections';
        sub_filter 'path("/aliases' 'path("/qdrant/aliases';
        sub_filter 'path("/cluster' 'path("/qdrant/cluster';
        sub_filter 'path("/telemetry' 'path("/qdrant/telemetry';
        sub_filter 'path("/metrics' 'path("/qdrant/metrics';
        sub_filter 'path("/locks' 'path("/qdrant/locks';
        sub_filter 'path("/healthz' 'path("/qdrant/healthz';
        sub_filter 'path("/livez' 'path("/qdrant/livez';
        sub_filter 'path("/readyz' 'path("/qdrant/readyz';
        sub_filter 'path("/issues' 'path("/qdrant/issues';
        sub_filter 'path("/snapshots' 'path("/qdrant/snapshots';
        sub_filter 'path("/")' 'path("/qdrant/")';
    }

    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/ {
        client_max_body_size 51m;
        proxy_connect_timeout 5s;
        proxy_send_timeout 420s;
        proxy_read_timeout 420s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
