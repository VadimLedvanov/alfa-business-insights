name: alfa-business-insights

services:
  postgres:
    container_name: alfa-db
    image: postgres:18
    env_file:
      - ../.env.example
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    container_name: alfa-backend
    build:
      context: ../backend/core
    env_file:
      - ../.env.example
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
